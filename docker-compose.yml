services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cloudcrm-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sql_16data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cloudcrm:
    build:
      context: .
      dockerfile: src/CloudCRM.Web/Dockerfile
    container_name: cloudcrm-web
    ports:
      - "8081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=CloudCRMDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;Encrypt=False;"

volumes:
  sql_16data: